name: Feature request
description: Suggest a tool, recipe, integration, or usability improvement.
title: "[Idea] "
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe your input files, the intended result, and any steps you do by hand today.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A sample prompt, recipe, or screenshot helps show how the feature should work.
